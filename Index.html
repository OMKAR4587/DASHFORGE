<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHFORGE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./CSS/Style.css">
  <link rel="stylesheet" href="./CSS/Sidebar.css">
  <link rel="stylesheet" href="./CSS/Nav.css">
  <link rel="stylesheet" href="./CSS/Main.css">
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <h3>Dash<span>forge</span></h3>
      <ul>
        <li><a href="#" class="active-list"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
        <li><a href="#"><i class="fa-solid fa-chart-simple"></i> Markets</a></li>
        <li><a href="#"><i class="fa-solid fa-eye"></i> Watchlist</a></li>
        <li><a href="#"><i class="fa-solid fa-wallet"></i> Portfolio</a></li>
        <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
      </ul>
    </aside>

    <!-- Main Content -->


    <!-- Navbar -->
    <nav>

      <section class="nav-context">
        <h1>Dashboard</h1>
        <p>Analysing market trends increases profit and reduces risk.</p>
      </section>

      <div class="nav-icons">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-bell"></i>

        <img class="profile-img" src="https://i.pravatar.cc/100" alt="Profile Image">
      </div>

    </nav>

    <!-- Main -->
    <main>
      <section>
        <div class="card-container">
          <select name="Trade Categories" class="dropdown-category">
            <option value="Financial">Financial</option>
            <option value="Technology">Technology</option>
            <option value="Service">Service</option>
          </select>

          <div class="card-section">

            <article class="crypto-card .active-card">

              <div class="coin-icon">₿</div>

              <div class="coin-info">
                <h4>Bitcoin</h4>
                <p>$20,000</p>
              </div>

              <div class="coin-change negative">
                <i class="fa-solid fa-arrow-trend-up"></i>
                <span> 0.23%</span>
              </div>

            </article>

             <article class="crypto-card">

              <div class="coin-icon">₿</div>

              <div class="coin-info">
                <h4>Bitcoin</h4>
                <p>$20,000</p>
              </div>

              <div class="coin-change negative">
                <i class="fa-solid fa-arrow-trend-up"></i>
                <span> 0.23%</span>
              </div>

            </article>

             <article class="crypto-card">

              <div class="coin-icon">₿</div>

              <div class="coin-info">
                <h4>Bitcoin</h4>
                <p>$20,000</p>
              </div>

              <div class="coin-change negative">
                <i class="fa-solid fa-arrow-trend-up"></i>
                <span> 0.23%</span>
              </div>

            </article>

            <article class="crypto-card">

              <div class="coin-icon">Ξ</div>

              <div class="coin-info">
                <h4>Ethereum</h4>
                <p>$1,500</p>
              </div>

              <div class="coin-change positive">
               <i class="fa-solid fa-arrow-trend-down"></i>
               <span> -1.12%</span>
              </div>

            </article>

            <article class="crypto-card">

              <div class="coin-icon">Ξ</div>

              <div class="coin-info">
                <h4>Ethereum</h4>
                <p>$1,500</p>
              </div>

              <div class="coin-change positive">
               <i class="fa-solid fa-arrow-trend-down"></i>
               <span> -1.12%</span>
              </div>

            </article>

          </div>
        </div>
        <div class="chart"></div>
      </section>

      <section>

      </section>
    </main>
  </div>

</body>

</html>
